<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nguyễn Minh Anh – Chuyên viên Truyền thông & Nội dung</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FFFFFF;--soft:#F4F7FB;--ink:#0B1F3A;--muted:#5B6B80;--line:#DDE4EE;--navy:#0B2A4A;--blue:#1257D6;--up:#0E9F6E;--on-navy:#fff;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){--bg:#0C1522;--soft:#121E2F;--ink:#E8EEF7;--muted:#97A6BA;--line:#223149;--navy:#0A1D33;--blue:#7BA6FF;--up:#3DDC9F}
}
:root[data-theme="dark"]{--bg:#0C1522;--soft:#121E2F;--ink:#E8EEF7;--muted:#97A6BA;--line:#223149;--navy:#0A1D33;--blue:#7BA6FF;--up:#3DDC9F}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:16px;line-height:1.7;font-variant-numeric:tabular-nums}
a{color:inherit}
a:focus-visible,button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--blue);outline-offset:3px}
.wrap{max-width:1040px;margin:0 auto;padding:0 24px}
header{background:var(--bg);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
header .wrap{display:flex;justify-content:space-between;align-items:center;gap:12px 24px;padding-top:14px;padding-bottom:14px;flex-wrap:wrap}
.brand{font-weight:800;font-size:17px;text-decoration:none;color:var(--navy);display:flex;align-items:center;gap:10px}
:root[data-theme="dark"] .brand{color:var(--ink)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .brand{color:var(--ink)}}
.logo{width:30px;height:30px;border-radius:6px;background:var(--navy);display:grid;place-items:center}
nav{display:flex;gap:24px;font-weight:500;font-size:15px;flex-wrap:wrap}
nav a{text-decoration:none;color:var(--muted);padding:4px 0;border-bottom:2px solid transparent}
nav a:hover,nav a.on{color:var(--ink);border-bottom-color:var(--blue)}
main{padding:0 0 72px;min-height:70vh}
.band{background:var(--navy);color:var(--on-navy)}
.hero{display:grid;grid-template-columns:1.3fr 1fr;gap:40px;align-items:center;padding:64px 0}
.hero h1{font-size:clamp(30px,5vw,46px);line-height:1.18;letter-spacing:-.02em;margin:0 0 16px;font-weight:800}
.hero p{margin:0 0 24px;color:#C9D6E8;font-size:18px;max-width:34em}
.tag{display:inline-block;font-size:13px;font-weight:600;background:rgba(255,255,255,.12);padding:4px 12px;border-radius:999px;margin-bottom:16px}
.btn{display:inline-block;font:700 15px "Be Vietnam Pro",sans-serif;padding:12px 22px;border-radius:6px;background:#fff;color:var(--navy);text-decoration:none;border:2px solid #fff;cursor:pointer}
.btn.ghost{background:transparent;color:#fff;border-color:rgba(255,255,255,.5)}
.btn.solid{background:var(--blue);border-color:var(--blue);color:#fff}
:root[data-theme="dark"] .btn.solid{color:#0C1522}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn.solid{color:#0C1522}}
.row{display:flex;gap:12px;flex-wrap:wrap}
.chart{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.18);border-radius:10px;padding:20px}
.chart small{color:#9FB3CE;font-size:13px}
.chart .big{font-size:34px;font-weight:800;line-height:1.2}
.chart .big span{font-size:15px;color:#4ADE9E;font-weight:600;margin-left:8px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:0;border:1px solid var(--line);border-radius:10px;margin:-36px 0 0;background:var(--bg);position:relative}
.kpi{padding:22px 24px;border-right:1px solid var(--line)}
.kpi:last-child{border:0}
.kpi b{display:block;font-size:30px;line-height:1.2;font-weight:800;color:var(--ink)}
.kpi b i{font-style:normal;color:var(--up);font-size:15px;margin-left:6px}
.kpi span{font-size:14px;color:var(--muted)}
section{padding:56px 0 0}
h2{font-size:26px;letter-spacing:-.01em;margin:0 0 6px;font-weight:800}
.sub{color:var(--muted);margin:0 0 28px;max-width:40em}
h1.page{font-size:clamp(28px,5vw,38px);margin:56px 0 8px;font-weight:800;letter-spacing:-.02em}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.card{border:1px solid var(--line);border-radius:10px;padding:24px;background:var(--bg);text-decoration:none;display:block}
.card:hover{border-color:var(--blue)}
.card h3{margin:0 0 6px;font-size:18px;line-height:1.35}
.card p{margin:0 0 14px;color:var(--muted);font-size:15px}
.res{font-weight:700;color:var(--up);font-size:15px}
.type{font-size:13px;font-weight:600;color:var(--blue);margin-bottom:8px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:48px}
.tl{list-style:none;padding:0;margin:0;border-left:2px solid var(--line)}
.tl li{padding:0 0 24px 22px;position:relative}
.tl li::before{content:"";position:absolute;left:-7px;top:7px;width:12px;height:12px;border-radius:50%;background:var(--blue)}
.tl time{font-size:14px;color:var(--muted)}
.tl h3{margin:0;font-size:17px}
.tl p{margin:4px 0 0;color:var(--muted);font-size:15px}
.chips{display:flex;flex-wrap:wrap;gap:8px;list-style:none;padding:0;margin:0}
.chips li{background:var(--soft);border:1px solid var(--line);padding:5px 14px;border-radius:6px;font-size:14px;font-weight:500}
.panel{background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:28px}
label{display:block;font-size:14px;font-weight:600;margin:0 0 4px}
input,textarea{width:100%;font:400 16px "Be Vietnam Pro",sans-serif;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:10px 12px;margin-bottom:16px}
.note{font-size:13px;color:var(--muted);margin-top:40px}
footer{border-top:1px solid var(--line);padding:24px 0;font-size:14px;color:var(--muted)}
@media (max-width:820px){.hero,.two{grid-template-columns:1fr;gap:28px}.grid{grid-template-columns:1fr}.kpis{grid-template-columns:1fr 1fr}.kpi:nth-child(2){border-right:0}.kpi:nth-child(-n+2){border-bottom:1px solid var(--line)}}
#view.editing{outline:2px dashed var(--blue);outline-offset:-6px;cursor:text}
#view.editing a{pointer-events:none}
#editbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:20;display:flex;gap:6px;flex-wrap:wrap;justify-content:center;background:var(--navy);padding:8px;border-radius:10px;box-shadow:0 6px 24px rgba(0,0,0,.25);max-width:calc(100% - 24px)}
#editbar button{font:600 13px "Be Vietnam Pro",sans-serif;color:#fff;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.25);border-radius:6px;padding:8px 12px;cursor:pointer}
#editbar button:hover{background:rgba(255,255,255,.26)}
</style>
</head>
<body>
<header><div class="wrap">
  <a class="brand" href="#"><span class="logo" aria-hidden="true"><svg width="18" height="18" viewBox="0 0 18 18"><path d="M2 13l4-5 3 3 6-7" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></span>Nguyễn Minh Anh</a>
  <nav>
    <a href="#" data-nav="home">Trang chủ</a>
    <a href="#ve-toi" data-nav="about">Về tôi</a>
    <a href="#san-pham" data-nav="products">Sản phẩm</a>
    <a href="#lien-he" data-nav="contact">Liên hệ</a>
  </nav>
</div></header>
<main id="view"></main>
<footer><div class="wrap">© 2026 Nguyễn Minh Anh · Trang mẫu minh họa, mọi số liệu và tên đơn vị là giả định.</div></footer>

<script>
var EDITOR=/*F*/false/*G*/;var STAMP=/*T*/0/*U*/;var SAVED=/*S*/{}/*E*/;
try{var L=JSON.parse(localStorage.getItem("saved_pages")||"null");if(L&&L.s===STAMP)SAVED=L.p}catch(e){}
var ME={name:"Nguyễn Minh Anh",email:"minhanh@example.com",phone:"0900 000 000"};
var P=[
 {t:"Video",n:"Series “Thị trường 5 phút”",d:"Video ngắn giải thích diễn biến VN-Index và tin vĩ mô cho nhà đầu tư mới. Phụ trách kịch bản, quay, dựng.",r:"120.000 lượt xem trung bình mỗi video"},
 {t:"Bản tin",n:"Bản tin thị trường hằng ngày",d:"Bản tin 1 trang gửi qua email và Zalo mỗi sáng, tóm tắt 5 điểm cần biết trước phiên giao dịch.",r:"Tỷ lệ mở email 42%"},
 {t:"Chiến dịch",n:"“Mở tài khoản trong 5 phút”",d:"Chiến dịch đa kênh giới thiệu quy trình mở tài khoản trực tuyến cho khách hàng trẻ.",r:"+35% tài khoản mới sau 3 tháng"},
 {t:"Thiết kế",n:"Infographic báo cáo vĩ mô quý",d:"Chuyển báo cáo phân tích dài thành infographic dễ đọc, dùng cho website và mạng xã hội.",r:"Lượt chia sẻ gấp 3 lần bài viết thường"},
 {t:"Sự kiện",n:"Webinar “Đầu tư cho người mới”",d:"Lên nội dung, điều phối diễn giả và truyền thông sự kiện trực tuyến cho 2.000 người đăng ký.",r:"2.000 lượt đăng ký"},
 {t:"Báo chí",n:"Quan hệ báo chí và PR",d:"Soạn thông cáo báo chí, làm việc với các tờ báo tài chính, theo dõi và báo cáo hiệu quả đưa tin.",r:"60+ bài báo mỗi năm"}
];
var v=document.getElementById("view");
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function cards(l){return '<div class="grid">'+l.map(function(p){return '<div class="card"><div class="type">'+p.t+'</div><h3>'+esc(p.n)+'</h3><p>'+esc(p.d)+'</p><div class="res">'+esc(p.r)+'</div></div>'}).join("")+'</div>'}
function home(){
 return '<div class="band"><div class="wrap hero"><div><span class="tag">Sẵn sàng làm việc từ 01/2027</span><h1>Biến thông tin tài chính phức tạp thành nội dung dễ hiểu.</h1><p>Mình là chuyên viên truyền thông và nội dung với 4 năm kinh nghiệm trong lĩnh vực tài chính, từng làm video, bản tin và chiến dịch cho nhà đầu tư cá nhân.</p><div class="row"><a class="btn" href="#san-pham">Xem sản phẩm</a><a class="btn ghost" href="#lien-he">Liên hệ</a></div></div>'+
 '<div class="chart"><small>Lượt xem kênh video (nghìn/tháng)</small><div class="big">480<span>▲ 62% sau 12 tháng</span></div>'+
 '<svg viewBox="0 0 300 120" width="100%" role="img" aria-label="Biểu đồ lượt xem tăng dần theo 12 tháng"><defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4ADE9E" stop-opacity=".35"/><stop offset="1" stop-color="#4ADE9E" stop-opacity="0"/></linearGradient></defs><path d="M0 100 L25 94 L50 96 L75 82 L100 78 L125 80 L150 62 L175 58 L200 48 L225 40 L250 30 L275 24 L300 14 L300 120 L0 120Z" fill="url(#g)"/><path d="M0 100 L25 94 L50 96 L75 82 L100 78 L125 80 L150 62 L175 58 L200 48 L225 40 L250 30 L275 24 L300 14" fill="none" stroke="#4ADE9E" stroke-width="2.5" stroke-linejoin="round"/></svg></div></div></div>'+
 '<div class="wrap"><div class="kpis"><div class="kpi"><b>4<i>năm</i></b><span>Kinh nghiệm ngành tài chính</span></div><div class="kpi"><b>120K<i>▲</i></b><span>Lượt xem trung bình mỗi video</span></div><div class="kpi"><b>+35%<i>▲</i></b><span>Tài khoản mới nhờ chiến dịch</span></div><div class="kpi"><b>42%</b><span>Tỷ lệ mở bản tin email</span></div></div>'+
 '<section><h2>Sản phẩm nổi bật</h2><p class="sub">Một số dự án tiêu biểu, kèm kết quả đo được.</p>'+cards(P.slice(0,3))+'<p style="margin-top:20px"><a href="#san-pham" style="color:var(--blue);font-weight:600">Xem tất cả sản phẩm</a></p></section></div>';
}
function about(){
 return '<div class="wrap"><h1 class="page">Về tôi</h1><p class="sub">Chuyên viên Truyền thông & Nội dung, hiện sống tại Hà Nội.</p><div class="two"><div>'+
 '<p>Mình tốt nghiệp ngành Truyền thông Marketing và bắt đầu làm việc với nội dung tài chính từ năm 2022. Mình tin rằng một nhà đầu tư mới chỉ tin tưởng khi họ hiểu rõ điều mình đang nói, nên mình tập trung viết ngắn, đúng số liệu và dễ nhớ.</p><p>Mình đã làm việc cùng đội phân tích, đội kinh doanh và đội tuân thủ, nên quen với quy trình kiểm duyệt nội dung và các quy định khi truyền thông về chứng khoán.</p>'+
 '<h2 style="font-size:20px;margin-top:32px">Kỹ năng</h2><ul class="chips"><li>Viết nội dung tài chính</li><li>Quay dựng video</li><li>Premiere Pro</li><li>Canva / Photoshop</li><li>Email marketing</li><li>Meta & TikTok Ads</li><li>Google Analytics</li><li>Quan hệ báo chí</li><li>Đọc hiểu báo cáo phân tích</li><li>Tiếng Anh IELTS 7.0</li></ul></div>'+
 '<div><h2 style="font-size:20px;margin-bottom:20px">Kinh nghiệm</h2><ul class="tl"><li><time>2024 – nay</time><h3>Chuyên viên Truyền thông</h3><p>Công ty Chứng khoán ABC. Phụ trách video, bản tin và chiến dịch mở tài khoản.</p></li><li><time>2022 – 2024</time><h3>Biên tập viên nội dung</h3><p>Trang tin tài chính XYZ. Viết 20+ bài mỗi tháng về thị trường chứng khoán.</p></li><li><time>2018 – 2022</time><h3>Cử nhân Truyền thông Marketing</h3><p>Đại học Kinh tế Quốc dân. Chứng chỉ Chứng khoán cơ bản năm 2022.</p></li></ul></div></div></div>';
}
function products(){return '<div class="wrap"><h1 class="page">Sản phẩm</h1><p class="sub">Những nội dung và chiến dịch mình đã thực hiện, kèm kết quả cụ thể.</p>'+cards(P)+'</div>'}
function contact(){
 return '<div class="wrap"><h1 class="page">Liên hệ</h1><p class="sub">Bạn đang tuyển vị trí truyền thông hoặc nội dung? Hãy nhắn cho mình, mình sẽ phản hồi trong 24 giờ.</p><div class="two"><div class="panel"><label for="n">Họ tên</label><input id="n" autocomplete="name"><label for="m">Lời nhắn</label><textarea id="m" rows="5"></textarea><button class="btn solid" id="send" type="button">Gửi qua email</button></div>'+
 '<div><h2 style="font-size:20px">Thông tin</h2><p>Email: <a href="mailto:'+ME.email+'" style="color:var(--blue);font-weight:600">'+ME.email+'</a><br>Điện thoại: '+ME.phone+'<br>LinkedIn: linkedin.com/in/minhanh</p><p class="note">Hồ sơ năng lực đầy đủ gửi theo yêu cầu.</p></div></div></div>';
}
function render(){
 var h=location.hash.replace("#",""),k="home",x;
 if(h==="ve-toi"){x=about();k="about"}else if(h==="san-pham"){x=products();k="products"}else if(h==="lien-he"){x=contact();k="contact"}else{x=home()}
 v.innerHTML=(SAVED[k]!=null?SAVED[k]:x);CUR=k;applyEdit();
 document.querySelectorAll("nav a").forEach(function(a){a.classList.toggle("on",a.dataset.nav===k)});
 var s=document.getElementById("send");
 if(s){s.onclick=function(){var n=document.getElementById("n").value,m=document.getElementById("m").value;location.href="mailto:"+ME.email+"?subject="+encodeURIComponent("Liên hệ từ "+(n||"nhà tuyển dụng"))+"&body="+encodeURIComponent(m)}}
 window.scrollTo(0,0);
}

var CUR="home",editing=false;
function applyEdit(){v.contentEditable=editing?"true":"false";v.classList.toggle("editing",editing)}
function persist(){try{localStorage.setItem("saved_pages",JSON.stringify({s:STAMP,p:SAVED}))}catch(e){}}
v.addEventListener("input",function(){SAVED[CUR]=v.innerHTML;persist()});
v.addEventListener("paste",function(e){if(!editing)return;e.preventDefault();var t=(e.clipboardData||window.clipboardData).getData("text");document.execCommand("insertText",false,t)});
function exportHTML(ed,name){
 var c=document.documentElement.cloneNode(true);
 var cv=c.querySelector("#view");cv.innerHTML="";cv.removeAttribute("contenteditable");cv.removeAttribute("class");
 var b=c.querySelector("#editbar");if(b)b.remove();
 var h="<!DOCTYPE html>\n"+c.outerHTML;
 var js=JSON.stringify(SAVED).replace(/</g,"\\u003c");
 h=h.replace(/\/\*S\*\/[\s\S]*?\/\*E\*\//,function(){return "/*S*/"+js+"/*E*/"});
 h=h.replace(/\/\*F\*\/[\s\S]*?\/\*G\*\//,function(){return "/*F*/"+ed+"/*G*/"});
 h=h.replace(/\/\*T\*\/[\s\S]*?\/\*U\*\//,function(){return "/*T*/"+Date.now()+"/*U*/"});
 var a=document.createElement("a");a.href=URL.createObjectURL(new Blob([h],{type:"text/html"}));a.download=name;document.body.appendChild(a);a.click();a.remove();
}
if(EDITOR){
 var bar=document.createElement("div");bar.id="editbar";
 bar.innerHTML='<button id="eb1" type="button">✏️ Bật chế độ sửa</button><button id="eb2" type="button">Tải bản để đăng web</button><button id="eb3" type="button">Lưu bản để sửa tiếp</button><button id="eb4" type="button">Khôi phục trang này</button>';
 document.body.appendChild(bar);
 document.getElementById("eb1").onclick=function(){editing=!editing;this.textContent=editing?"✅ Đang sửa (bấm để tắt)":"✏️ Bật chế độ sửa";applyEdit()};
 document.getElementById("eb2").onclick=function(){exportHTML("false","index.html")};
 document.getElementById("eb3").onclick=function(){exportHTML("true","website-de-sua.html")};
 document.getElementById("eb4").onclick=function(){delete SAVED[CUR];persist();render()};
}
window.addEventListener("hashchange",render);render();
</script>
</body>
</html>
