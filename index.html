<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nguyễn Văn A</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;700;800&family=Source+Serif+4:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FAFBFC;--ink:#1A1D23;--muted:#5C6470;--line:#E1E5EA;--accent:#2A55E5;--on-accent:#fff;--mark:#FFE45E;--card:#F0F3F8;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){--bg:#13161B;--ink:#E8EAEE;--muted:#9AA3AF;--line:#262B33;--accent:#8FA8FF;--on-accent:#13161B;--mark:#5A4B00;--card:#1B2028}
}
:root[data-theme="dark"]{--bg:#13161B;--ink:#E8EAEE;--muted:#9AA3AF;--line:#262B33;--accent:#8FA8FF;--on-accent:#13161B;--mark:#5A4B00;--card:#1B2028}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Source Serif 4",Georgia,"Times New Roman",serif;font-size:19px;line-height:1.75}
a{color:inherit}
a:focus-visible,button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.wrap{max-width:720px;margin:0 auto;padding:0 24px}
.sans,h1,h2,h3,nav,.brand,.btn,.meta,label{font-family:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",sans-serif}
header{border-bottom:1px solid var(--line)}
header .wrap{display:flex;justify-content:space-between;align-items:center;gap:12px 24px;padding-top:18px;padding-bottom:18px;flex-wrap:wrap}
.brand{font-weight:800;font-size:18px;text-decoration:none}
nav{display:flex;gap:22px;font-weight:500;font-size:15px;flex-wrap:wrap}
nav a{text-decoration:none;color:var(--muted);padding:2px 0;border-bottom:2px solid transparent}
nav a:hover,nav a.on{color:var(--ink);border-bottom-color:var(--accent)}
main{padding:56px 0 72px;min-height:70vh}
.hero{display:flex;gap:24px;align-items:center;margin-bottom:24px}
.avatar{flex:none;width:92px;height:92px;border-radius:50%;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;font:800 32px "Be Vietnam Pro",sans-serif}
h1{font-weight:800;font-size:clamp(30px,6vw,44px);line-height:1.2;letter-spacing:-.02em;margin:0}
h2{font-weight:700;font-size:22px;margin:56px 0 8px}
h3{font-weight:700;font-size:19px;margin:0 0 4px}
p{margin:0 0 18px}
.lede{font-size:22px;line-height:1.6}
.muted{color:var(--muted)}
.btn{display:inline-block;font-weight:700;font-size:15px;padding:12px 22px;border-radius:8px;border:2px solid var(--accent);background:var(--accent);color:var(--on-accent);text-decoration:none;cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.row{display:flex;gap:12px;flex-wrap:wrap;margin-top:8px}
.product{display:grid;grid-template-columns:1fr auto;gap:4px 16px;padding:24px 0;border-top:1px solid var(--line);text-decoration:none}
.product:hover h3{background:linear-gradient(transparent 62%,var(--mark) 62%)}
.product p{grid-column:1;margin:4px 0 0;color:var(--muted);font-size:17px;line-height:1.65}
.meta{font-size:14px;font-weight:500;color:var(--muted);white-space:nowrap}
.tl{list-style:none;padding:0;margin:0}
.tl li{display:grid;grid-template-columns:110px 1fr;gap:16px;padding:10px 0;font-size:17px}
.tl time{font:500 14px "Be Vietnam Pro",sans-serif;color:var(--muted);padding-top:4px}
.tags{display:flex;flex-wrap:wrap;gap:8px;list-style:none;padding:0;margin:12px 0 0}
.tags li{background:var(--card);border-radius:999px;padding:4px 14px;font:500 14px "Be Vietnam Pro",sans-serif}
.card{background:var(--card);padding:24px;border-radius:12px;margin:24px 0}
label{display:block;font-size:14px;font-weight:500;margin:0 0 4px}
input,textarea{width:100%;font:400 17px "Source Serif 4",Georgia,serif;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin-bottom:16px}
.links{display:flex;gap:20px;flex-wrap:wrap;font:500 16px "Be Vietnam Pro",sans-serif}
.links a{color:var(--accent)}
.acc{color:var(--accent)}
footer{border-top:1px solid var(--line);padding:28px 0;font:400 14px "Be Vietnam Pro",sans-serif;color:var(--muted)}
@media (max-width:520px){.hero{flex-direction:column;align-items:flex-start}.tl li{grid-template-columns:1fr;gap:0}.product{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>
  <div class="wrap">
    <a class="brand" href="#">Nguyễn Văn A</a>
    <nav>
      <a href="#" data-nav="home">Trang chủ</a>
      <a href="#ve-toi" data-nav="about">Về tôi</a>
      <a href="#san-pham" data-nav="products">Sản phẩm</a>
      <a href="#lien-he" data-nav="contact">Liên hệ</a>
    </nav>
  </div>
</header>

<main><div class="wrap" id="view"></div></main>
<footer><div class="wrap">© 2026 Nguyễn Văn A. Viết từ Hà Nội.</div></footer>

<script>
var ME = {
  name:"Nguyễn Văn A", initials:"NA", role:"[nghề nghiệp của bạn]", email:"email@example.com", phone:"0900 000 000",
  links:[["LinkedIn","#"],["Facebook","#"],["GitHub","#"]]
};
var PRODUCTS = [
  {name:"[Tên sản phẩm 1]", type:"Website", year:"2026", desc:"Một hai câu nói sản phẩm này là gì, giải quyết vấn đề gì và vai trò của bạn.", url:"#"},
  {name:"[Tên sản phẩm 2]", type:"Ứng dụng", year:"2025", desc:"Mô tả ngắn gọn, nêu kết quả cụ thể nếu có (số người dùng, doanh thu, giải thưởng).", url:"#"},
  {name:"[Tên sản phẩm 3]", type:"Thiết kế", year:"2024", desc:"Mô tả ngắn gọn về sản phẩm, công cụ bạn dùng và điều bạn tự hào nhất.", url:"#"}
];
var view = document.getElementById("view");
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}

function productList(list){
  return list.map(function(p){
    return '<a class="product" href="'+p.url+'"><h3>'+esc(p.name)+'</h3><span class="meta">'+esc(p.type)+' · '+p.year+'</span><p>'+esc(p.desc)+'</p></a>';
  }).join("");
}
function home(){
  return '<div class="hero"><div class="avatar" aria-hidden="true">'+ME.initials+'</div><h1>Xin chào, mình là '+esc(ME.name)+'.</h1></div>'+
  '<p class="lede">Mình là '+esc(ME.role)+'. Mình thích [điều bạn yêu thích] và đang làm những sản phẩm giúp [đối tượng] [lợi ích].</p>'+
  '<p class="muted">Viết 2–3 câu giới thiệu ngắn gọn: bạn là ai, bạn làm gì, và người đến đây sẽ tìm thấy gì.</p>'+
  '<div class="row"><a class="btn" href="#san-pham">Xem sản phẩm</a><a class="btn ghost" href="#lien-he">Liên hệ với mình</a></div>'+
  '<h2>Sản phẩm nổi bật</h2>'+productList(PRODUCTS.slice(0,2))+
  '<p style="margin-top:16px"><a class="acc" href="#san-pham">Xem tất cả sản phẩm</a></p>';
}
function about(){
  return '<h1>Về tôi</h1>'+
  '<p class="lede" style="margin-top:20px">Mình là '+esc(ME.name)+', '+esc(ME.role)+', hiện sống và làm việc tại Hà Nội.</p>'+
  '<p>Kể câu chuyện của bạn bằng giọng văn tự nhiên: bạn bắt đầu từ đâu, điều gì dẫn bạn đến công việc hiện tại, và điều gì bạn đang theo đuổi. Hãy viết như đang trò chuyện với một người bạn mới quen.</p>'+
  '<h2>Hành trình</h2><ul class="tl">'+
  '<li><time>2023 – nay</time><div><strong>[Chức danh]</strong>, [Tên công ty]</div></li>'+
  '<li><time>2020 – 2023</time><div><strong>[Chức danh]</strong>, [Tên công ty]</div></li>'+
  '<li><time>2016 – 2020</time><div><strong>[Ngành học]</strong>, [Tên trường]</div></li></ul>'+
  '<h2>Kỹ năng</h2><ul class="tags"><li>Kỹ năng 1</li><li>Kỹ năng 2</li><li>Kỹ năng 3</li><li>Kỹ năng 4</li><li>Tiếng Anh</li></ul>'+
  '<h2>Ngoài công việc</h2><p>Sở thích, thói quen hoặc điều thú vị về bạn. Phần này giúp người đọc thấy bạn là một con người thật.</p>';
}
function products(){
  return '<h1>Sản phẩm</h1><p class="muted" style="margin-top:8px">Những thứ mình đã làm và đang làm.</p><div style="margin-top:24px">'+productList(PRODUCTS)+'</div>';
}
function contact(){
  return '<h1>Liên hệ</h1><p class="lede" style="margin-top:20px">Bạn muốn hợp tác, hỏi thêm hoặc chỉ đơn giản là chào hỏi? Cứ nhắn cho mình.</p>'+
  '<div class="card"><label for="n">Tên của bạn</label><input id="n" autocomplete="name">'+
  '<label for="m">Lời nhắn</label><textarea id="m" rows="5"></textarea>'+
  '<button class="btn" id="send" type="button">Gửi qua email</button></div>'+
  '<p>Email: <a class="acc" href="mailto:'+ME.email+'">'+ME.email+'</a><br>Điện thoại: <a class="acc" href="tel:+84900000000">'+ME.phone+'</a></p>'+
  '<div class="links">'+ME.links.map(function(l){return '<a href="'+l[1]+'">'+l[0]+'</a>'}).join("")+'</div>';
}
function render(){
  var h = location.hash.replace("#",""), key="home", html;
  if(h==="ve-toi"){html=about();key="about"}
  else if(h==="san-pham"){html=products();key="products"}
  else if(h==="lien-he"){html=contact();key="contact"}
  else {html=home()}
  view.innerHTML = html;
  var titles={home:"",about:"Về tôi – ",products:"Sản phẩm – ",contact:"Liên hệ – "};
  document.title = titles[key]+ME.name;
  document.querySelectorAll("nav a").forEach(function(a){a.classList.toggle("on",a.dataset.nav===key)});
  var s=document.getElementById("send");
  if(s){s.onclick=function(){
    var n=document.getElementById("n").value, m=document.getElementById("m").value;
    location.href="mailto:"+ME.email+"?subject="+encodeURIComponent("Liên hệ từ "+(n||"website"))+"&body="+encodeURIComponent(m);
  }}
  window.scrollTo(0,0);
}
window.addEventListener("hashchange",render);
render();
</script>
</body>
</html>
